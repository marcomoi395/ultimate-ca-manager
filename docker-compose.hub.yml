# Standalone Docker Hub deployment for Ultimate CA Manager and the EJBCA migration stack.
# This file has no Compose-file dependencies and never builds local source.
#
# Required before enabling the migration profile:
#   export UCM_INTERNAL_AUTH_SECRET='a-long-random-shared-secret'
#   export EJBCA_DB_PASSWORD='a-long-random-database-password'
#
# Run:
#   docker compose -f docker-compose.hub.yml --profile migration up -d --pull always

services:
  ucm:
    image: youngmarco/ultimate-ca-manager:dev
    pull_policy: always
    container_name: ucm
    restart: unless-stopped
    ports:
      - "${UCM_HTTPS_PORT:-8443}:8443"
      - "${UCM_HTTP_PORT:-8080}:8080"
    volumes:
      - ucm-data:/opt/ucm/data
      - ucm-hsm-tokens:/var/lib/softhsm/tokens
    environment:
      UCM_FQDN: ${UCM_FQDN:-ucm.local}
      UCM_HTTPS_PORT: ${UCM_HTTPS_PORT:-8443}
      UCM_HTTP_PORT: ${UCM_HTTP_PORT:-8080}
      UCM_DEBUG: ${UCM_DEBUG:-false}
      UCM_LOG_LEVEL: ${UCM_LOG_LEVEL:-INFO}
      UCM_SECRET_KEY: ${UCM_SECRET_KEY:-}
      UCM_JWT_SECRET: ${UCM_JWT_SECRET:-}
      UCM_SESSION_TIMEOUT: ${UCM_SESSION_TIMEOUT:-3600}
      UCM_JWT_EXPIRATION: ${UCM_JWT_EXPIRATION:-86400}
      UCM_DATABASE_PATH: ${UCM_DATABASE_PATH:-/opt/ucm/data/ucm.db}
      UCM_BACKUP_ENABLED: ${UCM_BACKUP_ENABLED:-true}
      UCM_BACKUP_RETENTION_DAYS: ${UCM_BACKUP_RETENTION_DAYS:-30}
      UCM_SMTP_ENABLED: ${UCM_SMTP_ENABLED:-false}
      UCM_SMTP_SERVER: ${UCM_SMTP_SERVER:-}
      UCM_SMTP_PORT: ${UCM_SMTP_PORT:-587}
      UCM_SMTP_USERNAME: ${UCM_SMTP_USERNAME:-}
      UCM_SMTP_PASSWORD: ${UCM_SMTP_PASSWORD:-}
      UCM_SMTP_FROM: ${UCM_SMTP_FROM:-noreply@ucm.local}
      UCM_SMTP_TLS: ${UCM_SMTP_TLS:-true}
      UCM_CACHE_ENABLED: ${UCM_CACHE_ENABLED:-true}
      UCM_CACHE_TYPE: ${UCM_CACHE_TYPE:-simple}
      UCM_CACHE_DEFAULT_TIMEOUT: ${UCM_CACHE_DEFAULT_TIMEOUT:-300}
      UCM_MTLS_ENABLED: ${UCM_MTLS_ENABLED:-false}
      UCM_MTLS_CA_ID: ${UCM_MTLS_CA_ID:-}
      UCM_MTLS_REQUIRE_CERT: ${UCM_MTLS_REQUIRE_CERT:-false}
      UCM_DEFAULT_VALIDITY_DAYS: ${UCM_DEFAULT_VALIDITY_DAYS:-365}
      UCM_DEFAULT_KEY_SIZE: ${UCM_DEFAULT_KEY_SIZE:-4096}
      UCM_DEFAULT_HASH_ALGO: ${UCM_DEFAULT_HASH_ALGO:-SHA256}
      UCM_ACME_ENABLED: ${UCM_ACME_ENABLED:-true}
      UCM_ACME_DIRECTORY_URL: ${UCM_ACME_DIRECTORY_URL:-}
      UCM_HTTPS_CERT: ${UCM_HTTPS_CERT:-}
      UCM_HTTPS_KEY: ${UCM_HTTPS_KEY:-}
      UCM_INTERNAL_AUTH_SECRET: ${UCM_INTERNAL_AUTH_SECRET:?Set UCM_INTERNAL_AUTH_SECRET before enabling migration}
      EJBCA_GATEWAY_URL: ${EJBCA_GATEWAY_URL:-http://ejbca-gateway:8081}
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:${UCM_HTTPS_PORT:-8443}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: false
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      ucm-network:
        aliases:
          - ${UCM_FQDN:-ucm.local}
    labels:
      com.ultimate-ca-manager.description: Certificate Authority Management
      traefik.enable: "false"

  ejbca-database:
    image: ${EJBCA_DATABASE_IMAGE:-postgres:16-alpine}
    container_name: ${EJBCA_DATABASE_CONTAINER_NAME:-ucm-ejbca-database}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EJBCA_DB_NAME:-ejbca}
      POSTGRES_USER: ${EJBCA_DB_USER:-ejbca}
      POSTGRES_PASSWORD: ${EJBCA_DB_PASSWORD:?Set EJBCA_DB_PASSWORD before enabling migration}
    volumes:
      - ejbca-database:/var/lib/postgresql/data
    networks:
      - pki-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    profiles:
      - migration

  ejbca:
    image: ${EJBCA_IMAGE:-keyfactor/ejbca-ce:9.3.7}
    container_name: ${EJBCA_CONTAINER_NAME:-ucm-ejbca}
    hostname: ejbca
    restart: unless-stopped
    depends_on:
      ejbca-database:
        condition: service_healthy
    environment:
      DATABASE_JDBC_URL: jdbc:postgresql://ejbca-database:5432/${EJBCA_DB_NAME:-ejbca}
      DATABASE_USER: ${EJBCA_DB_USER:-ejbca}
      DATABASE_PASSWORD: ${EJBCA_DB_PASSWORD:?Set EJBCA_DB_PASSWORD before enabling migration}
      LOG_LEVEL_APP: ${EJBCA_LOG_LEVEL_APP:-INFO}
      LOG_LEVEL_SERVER: ${EJBCA_LOG_LEVEL_SERVER:-INFO}
    expose:
      - "8080"
      - "8443"
    # PoC only: publishes EJBCA on every host interface.
    ports:
      - "${EJBCA_HTTP_PORT:-8082}:8080"
      - "${EJBCA_HTTPS_PORT:-8444}:8443"
    networks:
      - pki-network
      - ejbca-ui-network
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://127.0.0.1:8443/ejbca/publicweb/healthcheck/ejbcahealth >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    profiles:
      - migration

  ejbca-gateway:
    image: youngmarco/ultimate-ca-manager-ejbca-gateway:dev
    pull_policy: always
    container_name: ${EJBCA_GATEWAY_CONTAINER_NAME:-ucm-ejbca-gateway}
    restart: unless-stopped
    depends_on:
      ejbca:
        condition: service_healthy
    environment:
      EJBCA_GATEWAY_ENV: development
      EJBCA_GATEWAY_HOST: 0.0.0.0
      EJBCA_GATEWAY_PORT: 8081
      EJBCA_API_URL: ${EJBCA_API_URL:-https://ejbca:8443/ejbca/ejbca-rest-api}
      EJBCA_CA_CERT_FILE: ${EJBCA_CA_CERT_FILE:-/run/secrets/ejbca/ca.crt}
      EJBCA_CLIENT_CERT_FILE: ${EJBCA_CLIENT_CERT_FILE:-/run/secrets/ejbca/client.crt}
      EJBCA_CLIENT_KEY_FILE: ${EJBCA_CLIENT_KEY_FILE:-/run/secrets/ejbca/client.key}
      EJBCA_TIMEOUT_MS: ${EJBCA_TIMEOUT_MS:-30000}
      UCM_AUTH_BASE_URL: ${UCM_AUTH_BASE_URL:-https://${UCM_FQDN:-ucm.local}:8443}
      UCM_INTERNAL_AUTH_SECRET: ${UCM_INTERNAL_AUTH_SECRET:?Set UCM_INTERNAL_AUTH_SECRET before enabling migration}
    volumes:
      - ${EJBCA_CERTS_DIR:-./secrets/ejbca}:/run/secrets/ejbca:ro
    expose:
      - "8081"
    # PoC only: publishes the gateway API on every host interface.
    ports:
      - "${EJBCA_GATEWAY_PORT:-8081}:8081"
    networks:
      - ucm-network
      - pki-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/api/v3/health').then(async r => { const body = await r.json(); process.exit(r.ok && body.data?.ejbca === 'healthy' ? 0 : 1); }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      com.ultimate-ca-manager.service: ejbca-gateway
    profiles:
      - migration

networks:
  ucm-network:
    driver: bridge
  pki-network:
    driver: bridge
    internal: true
  # PoC only: permits host-published EJBCA UI ports.
  ejbca-ui-network:
    driver: bridge

volumes:
  ucm-data:
    driver: local
  ucm-hsm-tokens:
    driver: local
  ejbca-database:
    driver: local
