# ============================================================================
# UCM - Docker Compose Development Configuration
# ============================================================================
# Development setup with hot-reload, debugging, and verbose logging
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# REQUIRES Docker Compose >= 2.24: the `ports: !override` below is a hard
# parse error on older releases ("!override" is reported as an unknown YAML
# tag). Upgrade Compose rather than removing the tag — without it the base
# file's all-interfaces port publishes silently survive the merge.
#
# ############################################################################
# # NEVER EXPOSE THIS CONFIGURATION TO AN UNTRUSTED NETWORK.                ##
# # FLASK_DEBUG=true enables the Werkzeug debug middleware: its traceback   ##
# # pages disclose source code and variable contents to ANY client with no  ##
# # authentication, and its PIN-gated console is remote code execution.     ##
# # The debugpy port is unauthenticated. Published ports, including       ##
# # middleware 8081 and MailHog, stay loopback-only by default.           ##
# # If Docker runs inside a VM and you need the app from outside it, set  ##
# # VM-internal interface — that re-exposes the Werkzeug debugger to        ##
# # whatever can reach it, so only do so on a trusted, isolated network.    ##
# # Never use this file in production.                                      ##
# ############################################################################
# ============================================================================


services:
  ucm:
    image: ultimate-ca-manager:dev
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
    # Mount source code for hot-reload
    volumes:
      - ./backend:/opt/ucm/backend:rw
      - ucm-data:/opt/ucm/data
      
      # Don't mount these (keep container versions)
      # - ./backend/__pycache__
      # - ./backend/.pytest_cache
    
    # Development environment
    environment:
      # Debug mode
      - UCM_DEBUG=true
      - UCM_LOG_LEVEL=DEBUG
      
      # Flask debug mode (hot-reload)
      - FLASK_DEBUG=true
      
      # Disable caching for development
      - UCM_CACHE_ENABLED=false
      
      # Disable backups for development
      - UCM_BACKUP_ENABLED=false
      
      - SQL_DEBUG=false  # Set true if needed (very verbose!)
      - UCM_INTERNAL_AUTH_SECRET=${UCM_INTERNAL_AUTH_SECRET:-change-me-in-development}
      - EJBCA_GATEWAY_URL=${EJBCA_GATEWAY_URL:-http://ejbca-gateway:8081}
      
      # Test SMTP (use Mailhog or similar)
      - UCM_SMTP_ENABLED=false
      - UCM_SMTP_SERVER=mailhog
      - UCM_SMTP_PORT=1025
      - UCM_SMTP_TLS=false
    
    # Override command to use Flask dev server with auto-reload
    command: python3 -m flask run --host=0.0.0.0 --port=8443 --cert=data/https_cert.pem --key=data/https_key.pem --reload
    
    # Expose the dev server and debugger, loopback-only by default.
    # `!override` REPLACES the base file's port list instead of merging with
    # it: Compose merges `ports` entries by (host_ip, published, protocol),
    # so a bare `127.0.0.1:` prefix here would silently APPEND to the base
    # file's 0.0.0.0 publishes and leave the Werkzeug debugger reachable
    # from the network. Requires Docker Compose >= 2.24.
    # Docker-in-a-VM escape hatch: set UCM_DEV_BIND to the VM-internal
    # interface (see the banner above before doing so).
    ports: !override
      - "${UCM_DEV_BIND:-127.0.0.1}:${UCM_HTTPS_PORT:-8443}:8443"
      - "${UCM_DEV_BIND:-127.0.0.1}:${UCM_HTTP_PORT:-8080}:8080"
      # The unauthenticated Python debugger stays loopback-only
      # unconditionally — tunnel (`ssh -L 5678:127.0.0.1:5678 <vm>`) if you
      # need it from another machine.
      - "127.0.0.1:5678:5678"  # Python debugger (debugpy)
    
    # Relaxed resource limits for development
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    
    # Development logging (more verbose)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    labels:
      - "com.ultimate-ca-manager.environment=development"
  
  # Optional: Mailhog for testing email notifications
  mailhog:
    image: mailhog/mailhog:latest
    container_name: ucm-mailhog
    restart: unless-stopped
    
    # Loopback-only like the app ports (the banner's containment claim covers
    # every published port); UCM_DEV_BIND is the same VM escape hatch.
    ports:
      - "${UCM_DEV_BIND:-127.0.0.1}:8025:8025"  # Web UI
      - "${UCM_DEV_BIND:-127.0.0.1}:1025:1025"  # SMTP
    
    networks:
      - ucm-network
    
    labels:
      - "com.ultimate-ca-manager.service=mailhog"
  
  # Optional: Redis for testing caching
  # redis:
  #   image: redis:alpine
  #   container_name: ucm-redis
  #   restart: unless-stopped
  #   
  #   ports:
  #     - "6379:6379"
  #   
  #   networks:
  #     - ucm-network
  # EJBCA integration stack (development only)
  # Start with: docker compose --env-file .env.ejbca.example -f docker-compose.yml -f docker-compose.dev.yml --profile migration up
  ejbca-database:
    image: "${EJBCA_DATABASE_IMAGE:-postgres:16-alpine}"
    container_name: ${EJBCA_DATABASE_CONTAINER_NAME:-ucm-ejbca-database}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EJBCA_DB_NAME:-ejbca}
      POSTGRES_USER: ${EJBCA_DB_USER:-ejbca}
      POSTGRES_PASSWORD: ${EJBCA_DB_PASSWORD:-change-me-in-development}
    volumes:
      - ejbca-database:/var/lib/postgresql/data
    networks:
      - pki-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    profiles:
      - migration

  ejbca:
    image: "${EJBCA_IMAGE:-keyfactor/ejbca-ce:9.3.7}"
    container_name: ${EJBCA_CONTAINER_NAME:-ucm-ejbca}
    hostname: ejbca
    restart: unless-stopped
    depends_on:
      ejbca-database:
        condition: service_healthy
    environment:
      DATABASE_JDBC_URL: jdbc:postgresql://ejbca-database:5432/${EJBCA_DB_NAME:-ejbca}
      DATABASE_USER: ${EJBCA_DB_USER:-ejbca}
      DATABASE_PASSWORD: ${EJBCA_DB_PASSWORD:-change-me-in-development}
      LOG_LEVEL_APP: ${EJBCA_LOG_LEVEL_APP:-INFO}
      LOG_LEVEL_SERVER: ${EJBCA_LOG_LEVEL_SERVER:-INFO}
      # simple is suitable only for isolated development; use proper mTLS in production.
      TLS_SETUP_ENABLED: ${EJBCA_TLS_SETUP_ENABLED:-simple}
    expose:
      - "8080"
      - "8443"
    # UCM already uses host ports 8080/8443, so publish EJBCA on alternate
    # loopback ports for direct access during development.
    ports:
      - "127.0.0.1:8082:8080"
      - "127.0.0.1:8444:8443"
    networks:
      - pki-network
      - ejbca-ui-network
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://127.0.0.1:8443/ejbca/publicweb/healthcheck/ejbcahealth >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    profiles:
      - migration

  ejbca-gateway:
    image: ultimate-ca-manager-ejbca-gateway:dev
    build:
      context: ./ejbca-gateway
      dockerfile: Dockerfile
    container_name: ${EJBCA_GATEWAY_CONTAINER_NAME:-ucm-ejbca-gateway}
    restart: unless-stopped
    depends_on:
      ejbca:
        # EJBCA has a long first boot; the gateway retries API calls in dev.
        condition: service_started
    environment:
      EJBCA_GATEWAY_ENV: development
      EJBCA_GATEWAY_HOST: 0.0.0.0
      EJBCA_GATEWAY_PORT: 8081
      EJBCA_API_URL: ${EJBCA_API_URL:-https://ejbca:8443/ejbca/ejbca-rest-api}
      EJBCA_CA_CERT_FILE: ${EJBCA_CA_CERT_FILE:-/run/secrets/ejbca/ca.crt}
      EJBCA_CLIENT_CERT_FILE: ${EJBCA_CLIENT_CERT_FILE:-/run/secrets/ejbca/client.crt}
      EJBCA_CLIENT_KEY_FILE: ${EJBCA_CLIENT_KEY_FILE:-/run/secrets/ejbca/client.key}
      EJBCA_TIMEOUT_MS: ${EJBCA_TIMEOUT_MS:-30000}
      UCM_AUTH_BASE_URL: ${UCM_AUTH_BASE_URL:-https://ucm:8443}
      UCM_INTERNAL_AUTH_SECRET: ${UCM_INTERNAL_AUTH_SECRET:-change-me-in-development}
    volumes:
      # Mount gateway source for NestJS hot-reload during development.
      - ./ejbca-gateway:/app:rw
      # Keep image-installed dependencies available when /app is bind-mounted.
      - /app/node_modules
      - ${EJBCA_CERTS_DIR:-./secrets/ejbca}:/run/secrets/ejbca:ro
    command: bunx nest start --watch
    expose:
      - "8081"
    ports:
      - "${UCM_DEV_BIND:-127.0.0.1}:${EJBCA_GATEWAY_PORT:-8081}:8081"
    networks:
      - ucm-network
      - pki-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/api/v3/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "com.ultimate-ca-manager.service=ejbca-gateway"
    profiles:
      - migration

networks:
  pki-network:
    driver: bridge
    internal: true
  # A non-internal bridge is required for Docker to publish EJBCA's
  # development-only UI ports to the host loopback interface.
  ejbca-ui-network:
    driver: bridge

volumes:
  ejbca-database:
    driver: local
